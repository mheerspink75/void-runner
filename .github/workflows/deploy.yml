name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Run the same checks on pull requests so a broken import or a stale method
  # call is caught before merge, not after. The deploy job is skipped for
  # these (see `if:` below) -- a PR should never publish.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Group by event and ref so a superseded PR run cannot cancel an unrelated
# push-to-main deploy, and so a new push still supersedes the previous one.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks, run before anything is published. All five tools are
  # stdlib-only python3, which the runner already provides, so there is nothing
  # to install and no lockfile to drift. They exist because this project is
  # written without a browser or a JS runtime available, and between them they
  # catch the failures that would otherwise only show up as a runtime TypeError.
  check:
    name: Static checks
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Show python version
        run: python3 --version

      - name: validate.py
        run: python3 tools/validate.py .

      - name: api_check.py
        run: python3 tools/api_check.py .

      - name: smoke.py
        run: python3 tools/smoke.py .

      - name: sim_melee.py
        run: python3 tools/sim_melee.py

      - name: sim_collision.py
        run: python3 tools/sim_collision.py

      - name: verify_rayblocked.py
        run: python3 tools/verify_rayblocked.py

      # The one check that runs the real thing. The other six are static
      # analysis or headless simulation and cannot see a module 404, a
      # constructor that throws, or a gameplay system that explodes on first
      # input -- those only appear in a browser. GitHub's runners ship Chrome
      # preinstalled and Node 22 has WebSocket built in, so this needs no
      # install step and no lockfile.
      #
      # It serves the current checkout rather than the live Pages URL, because
      # the deploy for this commit has not happened yet -- testing the previous
      # deploy would gate the wrong code. tools/serve.py is the stdlib server
      # from the repo, which also means the no-store header path gets exercised.
      - name: Browser smoke test (real Chrome, no install)
        run: |
          python3 tools/serve.py 8099 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -sf "http://127.0.0.1:8099/index.html" >/dev/null && break
            sleep 0.25
          done
          curl -sf "http://127.0.0.1:8099/index.html" >/dev/null || {
            echo "local server did not start"; exit 1; }
          node tools/browser_smoke.mjs "http://127.0.0.1:8099/"

  deploy:
    # Publishing is blocked until every check above passes, so a broken import
    # or a stale method call cannot reach the live site.
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
